<title>혼커톤 웹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
/* Layout: desktop workspace. Left rail (nav + cohort), main column opens with a red ink-pad band carrying the day number,
   then the whole cohort's 28-day stamp board. Red is reserved for my own stamps and seals; everything else stays ink on paper. */
:root {
  --bg: #F2F3F5; --panel: #FFFFFF; --sunk: #E7E9ED; --ink: #14161B; --muted: #626975; --line: #D6D9DF;
  --seal: #D42E24; --seal-soft: #FBE3E0; --hero: #D42E24; --hero-ink: #FFFFFF;
  --make: #1D4ED8; --make-bg: #E1E9FD; --take: #0A7D62; --take-bg: #DCF2EB;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101216; --panel: #191C22; --sunk: #0B0D10; --ink: #ECEEF2; --muted: #9299A6; --line: #2C313A;
  --seal: #FF5B50; --seal-soft: #3A1C1A; --hero: #C4281F; --hero-ink: #FFFFFF;
  --make: #8FB0FF; --make-bg: #1B2745; --take: #5FD3B3; --take-bg: #12332B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101216; --panel: #191C22; --sunk: #0B0D10; --ink: #ECEEF2; --muted: #9299A6; --line: #2C313A;
  --seal: #FF5B50; --seal-soft: #3A1C1A; --hero: #C4281F; --hero-ink: #FFFFFF;
  --make: #8FB0FF; --make-bg: #1B2745; --take: #5FD3B3; --take-bg: #12332B; color-scheme: dark }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 80px }
h1, h2, h3, p, dl, dd { margin: 0 }
button, input, textarea, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--make); outline-offset: 2px }
.muted { color: var(--muted) } .small { font-size: 13px }

.app { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 28px; align-items: start }
.rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 22px; min-width: 0 }
.logo { font-family: var(--display); font-size: 34px; line-height: 1; letter-spacing: -.01em }
.logo i { font-style: normal; color: var(--seal) }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap }
.nav a:hover { color: var(--ink) }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
.railh { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px }
.mem { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; min-width: 0 }
.mem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none }
.pip.on { background: var(--ink); border-color: var(--ink) } .pip.me.on { background: var(--seal); border-color: var(--seal) }
.proto { border: 1px dashed var(--muted); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted) }
main { display: flex; flex-direction: column; gap: 22px; min-width: 0 }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px }
  .rail { position: static; gap: 12px }
  .nav { flex-direction: row; overflow-x: auto }
  .rail .cohort { display: none }
  .proto { flex-direction: row; flex-wrap: wrap; align-items: center }
}

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block }
.btn:hover { border-color: var(--muted) }
.btn.pri { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.btn.red { background: var(--seal); border-color: var(--seal); color: var(--hero-ink) }
.btn.sm { padding: 4px 10px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap }
.chip.make { background: var(--make-bg); color: var(--make) } .chip.take { background: var(--take-bg); color: var(--take) }
.chip.ok { background: var(--ink); color: var(--bg) } .chip.wait { background: var(--sunk); color: var(--muted) }
.row { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap } .grow { flex: 1; min-width: 0 }
h2 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.2; text-wrap: balance }
h3 { font-size: 17px; font-weight: 600; line-height: 1.4 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; position: relative }

/* 인주 띠 */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 18px; padding: 26px 30px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 32px; align-items: end }
.daynum { font-family: var(--display); font-size: clamp(96px, 15vw, 176px); line-height: .8; letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.daynum small { font-size: .2em; letter-spacing: 0; margin-left: 6px }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.2vw, 38px); line-height: 1.15; text-wrap: balance }
.hero p { font-size: 16px; font-weight: 500; margin-top: 8px }
.hero .side { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.5 }
.hero .side b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1 }
@media (max-width: 700px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 22px 20px } .hero .side { text-align: left } }

/* 모두의 도장판 */
.scroll { overflow-x: auto }
.board { display: grid; grid-template-columns: minmax(150px, 200px) repeat(28, minmax(17px, 1fr)) 52px; row-gap: 2px; align-items: stretch; min-width: 800px }
.board > * { display: flex; align-items: center; justify-content: center; min-height: 34px }
.board .who { justify-content: flex-start; gap: 8px; min-width: 0; padding-right: 10px }
.board .who div { min-width: 0; line-height: 1.25 }
.board .who b, .board .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.board .hd { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0; cursor: pointer; min-height: 24px }
.cw { cursor: pointer }
.cw.sel, .hd.sel { background: var(--sunk) } .hd.sel { color: var(--ink); font-weight: 600; border-radius: 6px 6px 0 0 }
.cw.we { border-right: 1px solid var(--line) }
.dot { width: 15px; height: 15px; border-radius: 50%; display: block; color: var(--ink) }
.dot.done { background: currentColor } .dot.miss { width: 5px; height: 5px; background: var(--line) }
.dot.fut { border: 1.5px dashed var(--line) }
.dot.out { outline: 2px solid currentColor; outline-offset: 2px }
.mine .dot { color: var(--seal) }
.run { font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums }
.legend { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 7px }

.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; align-items: start }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) } }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0 }

form { display: flex; flex-direction: column; gap: 10px; margin: 0 }
label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 4px }
label .hint { font-weight: 400; color: var(--muted) }
input[type=text], input[type=url], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; font-weight: 400 }
textarea { resize: vertical; min-height: 68px }
.err { color: var(--seal); font-size: 13px; font-weight: 500 }

/* 참 잘했어요 도장 */
.good { position: absolute; right: 18px; top: 14px; width: 86px; height: 86px; border-radius: 50%; border: 3px double var(--seal); color: var(--seal); display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 19px; line-height: 1.05; transform: rotate(-12deg); pointer-events: none }
.good.thump { animation: thump .45s cubic-bezier(.2, 1.6, .4, 1) both }
@keyframes thump { from { transform: rotate(-30deg) scale(2.6); opacity: 0 } to { transform: rotate(-12deg) scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .good.thump { animation: none } }
.said { font-family: var(--serif); font-size: 17px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 96px }

/* 인감 */
.ingam { width: 46px; height: 46px; border: 2.5px solid var(--seal); color: var(--seal); border-radius: 6px; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 15px; line-height: 1; flex: none; transform: rotate(-4deg) }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none }
.av.me { background: var(--seal); color: var(--hero-ink) }

.post { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 9px; min-width: 0 }
.post:first-of-type { border-top: 0; padding-top: 0 }
.body { white-space: pre-wrap; overflow-wrap: anywhere }
.fields { display: flex; flex-direction: column; gap: 12px; font-family: var(--serif); font-size: 16px; line-height: 1.8 }
.fields dt { font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted) }
.fields dd { white-space: pre-wrap; overflow-wrap: anywhere }
.rx { display: flex; gap: 6px; flex-wrap: wrap }
.rx button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 11px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums }
.rx button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg) }
.cms { display: flex; flex-direction: column; gap: 3px; font-size: 14px }
.cmf { flex-direction: row; gap: 6px } .cmf input { flex: 1; min-width: 0; padding: 6px 10px }

/* 원고지 */
.paper { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 30px 32px 34px; position: relative; min-width: 0;
  background-image: linear-gradient(var(--seal-soft) 1px, transparent 1px); background-size: 100% 29px; background-position: 0 30px }
.paper .kicker { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--seal); line-height: 29px }
.paper h3 { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 29px; margin-bottom: 29px }
.paper .fields { gap: 29px; line-height: 29px } .paper .fields dt { line-height: 29px }
.paper .ph { color: var(--muted) }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 500 }
.steps span { padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted) }
.steps span.on { background: var(--ink); color: var(--bg) }

.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px }
.book { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; min-width: 0 }
.book:hover { border-color: var(--ink) }
.book.open { grid-column: 1 / -1; cursor: default; border-color: var(--ink) }
.book .t { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.45; text-wrap: balance }
.book .ex { font-family: var(--serif); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
.seg { display: flex; gap: 4px; flex-wrap: wrap }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; font-weight: 500 }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }

/* 선언문 */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px }
.pledge { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.pledge.mine { border-color: var(--seal) }
.pledge p.s, .madlib { font-family: var(--serif); font-size: 18px; line-height: 1.9; overflow-wrap: anywhere }
.pledge p.s b, .madlib b { box-shadow: inset 0 -.5em var(--seal-soft); font-weight: 700 }
.madlib { font-size: 21px; line-height: 2.5 }
.madlib input[type=text], .madlib select { display: inline-block; width: auto; max-width: 100%; font-family: var(--serif); font-weight: 700; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; background: transparent; padding: 0 4px; vertical-align: baseline }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
@media (max-width: 560px) { .types { grid-template-columns: 1fr } }
.types label { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-weight: 400; flex-direction: row; gap: 8px; align-items: flex-start }
.types label:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink) }
.types b { display: block; font-weight: 600 }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-block: 1px solid var(--line) }
.stat { padding: 14px 16px; border-left: 1px solid var(--line) } .stat:first-child { border-left: 0; padding-left: 0 }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums }
.stat span { font-size: 12px; color: var(--muted) }
.empty { text-align: center; padding: 30px 12px; color: var(--muted); align-items: center }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); z-index: 20 }
</style>

<div class="app">
  <aside class="rail">
    <div class="logo">혼커<i>톤</i></div>
    <nav class="nav" id="nav" aria-label="화면">
      <a href="#today">오늘</a><a href="#write">인출물 쓰기</a><a href="#library">서재</a><a href="#wall">선언 벽</a><a href="#retro">회고</a>
    </nav>
    <div class="cohort" id="cohort"></div>
    <div class="proto" id="proto"></div>
  </aside>
  <main id="view"></main>
</div>
<div id="toast" role="status" hidden></div>

<script>

    h += '<div class="paper"><div class="kicker">' + (w + 1) + '주차 · ' + esc(g.type === 'take' ? g.form : '진척 정리') + ' · ' + esc(nameOf('me')) + '</div><h3>' + esc(g.title) + '</h3><dl class="fields" id="pv">';
    TPL[g.type].forEach(function (t, i) {
      var val = o ? esc(o.f[i][1]) : (t[1] === 3 ? '<span data-out="s0" class="ph">첫째 줄</span>\n<span data-out="s1" class="ph">둘째 줄</span>\n<span data-out="s2" class="ph">셋째 줄</span>' : '<span data-out="f' + i + '" class="ph">여기에 미리보기가 나타나요</span>');
      h += '<div><dt>' + t[0] + '</dt><dd>' + val + '</dd></div>';
    });
    return h + '</dl></div></div>';
  }

  function vLibrary() {
    var f = ui.filter, ps = state.posts.filter(function (p) { return p.kind === 'output' && (f === 'all' || (f === 'mine' ? p.who === 'me' : p.type === f)); }).sort(function (a, b) { return b.day - a.day; });
    var h = '<div><h2>서재</h2><p class="muted">11월 기수가 꺼내 쓴 것들이 한 편씩 꽂혀요.</p></div><div class="seg">' + [['all', '전체'], ['mine', '내 것'], ['take', '받아들이는 활동'], ['make', '만드는 활동']].map(function (x) { return '<button type="button" data-act="filter" data-f="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>';
    if (!ps.length) return h + '<section class="panel empty"><p>아직 꽂힌 글이 없어요.</p></section>';
    return h + '<div class="lib">' + ps.map(function (p) {
      var head = '<div class="row"><span class="chip ' + p.type + '">' + (week(p.day) + 1) + '주차 ' + outName(p.type) + '</span><span class="grow"></span>' + (p.who === 'me' ? '<span class="chip ' + (rxN(p) ? 'ok">완료' : 'wait">반응 대기') + '</span>' : '') + '</div><div class="t">' + esc(p.goal) + '</div>';
      var by = '<div class="small muted">' + esc(nameOf(p.who)) + ' · 반응 ' + rxN(p) + ' · 댓글 ' + p.cm.length + '</div>';
      if (ui.open === p.id) return '<article class="book open">' + head + by + fieldsHtml(p.f) + social(p) + '<div><button class="btn sm" data-act="book" data-id="">접기</button></div></article>';
      return '<article class="book" tabindex="0" role="button" data-act="book" data-id="' + p.id + '">' + head + '<div class="ex">' + esc(p.f[0][1]) + '</div>' + by + '</article>';
    }).join('') + '</div>';
  }

  function pledgeHtml(who, title, done, type, form, gid) {
    var n = nameOf(who);
    return '<article class="pledge' + (who === 'me' ? ' mine' : '') + '"><div class="row"><span class="chip ' + type + '">' + typeName(type) + '</span><span class="grow"></span>' + (gid ? '<button class="btn sm" data-act="del" data-g="' + gid + '">철회</button>' : '') + '</div>' +
      '<p class="s">나 ' + esc(n) + pp(n, '은', '는') + ' 28일 동안 <b>' + esc(title) + '</b>' + pp(title, '을', '를') + ' 한다. 끝났다는 증거는 <b>' + esc(done) + '</b>.</p>' +
      '<div class="row"><p class="small muted grow">' + (type === 'take' ? '매일 알게 된 것 한 줄, 매주 ' + esc(form) : '매일 만든 것 한 줄, 매주 진척 정리') + '</p><div class="ingam">' + esc(n.slice(0, 2)) + '</div></div></article>';
  }
  function vWall() {
    var h = '<div><h2>선언 벽</h2><p class="muted">하고 싶던 일을 여기에 걸어 두고, 서로의 증인이 돼요.</p></div>';
    h += '<form class="panel" data-form="goal"><div class="madlib">나 <input type="text" id="g-name" name="name" size="5" placeholder="이름" value="' + esc(state.name) + '" aria-label="이름">은(는) 28일 동안 <input type="text" id="g-title" name="title" size="18" placeholder="하고 싶던 일" aria-label="하고 싶던 일">을(를) 한다.<br>끝났다는 증거는 <input type="text" id="g-done" name="done" size="22" placeholder="눈에 보이는 결과물" aria-label="끝났다는 증거">.</div>' +
      '<div class="types"><label><input type="radio" name="type" id="g-make" value="make" checked><span><b>만드는 활동</b><span class="small muted">코딩, 그림, 운동 기록. 만든 것 자체로 도장을 받아요.</span></span></label><label><input type="radio" name="type" id="g-take" value="take"><span><b>받아들이는 활동</b><span class="small muted">독서, 강의, 영화. 꺼내 쓴 것이 있어야 도장을 받아요.</span></span></label></div>' +
      '<label id="g-formwrap" hidden>매주 남길 인출물<select id="g-form" name="form" style="max-width:240px"><option>독후감</option><option>후기 글</option><option>3분 발표</option><option>마인드맵</option><option>다른 사람용 퀴즈</option></select></label>' +
      '<p class="small muted" id="g-hint">증거는 분량보다 결과물로 적어요. 예: 지인 3명이 써볼 수 있는 배포 주소</p><p class="err" hidden></p><div><button class="btn red">도장 찍고 선언하기</button></div></form><div class="wall">';
    state.goals.forEach(function (g) { h += pledgeHtml('me', g.title, g.done, g.type, g.form, g.id); });
    BOTS.forEach(function (k) { var m = MEMBERS[k]; h += pledgeHtml(k, m.goal, m.done, m.type, m.form); });
    return h + '</div>';
  }

  function vRetro() {
    if (!state.goals.length) return '<section class="panel empty"><h2>회고할 기록이 아직 없어요</h2><p>선언하고 도장을 쌓으면 여기에 모여요.</p></section>';
    var left = LEN - 1 - state.day, h = '<div><h2>' + (left > 0 ? '지금까지 쌓인 것' : '28일이 끝났어요') + '</h2><p class="muted">' + (left > 0 ? '종료까지 ' + left + '일 남았어요.' : '끝까지 못 했어도 어디까지 했고 무엇을 배웠는지 남기면 완주예요.') + '</p></div>';
    state.goals.forEach(function (g) {
      var s = streak(dayMap(rowPosts('me', g.id))), outs = rowPosts('me', g.id).filter(function (p) { return p.kind === 'output'; }), c = state.closing[g.id];
      h += '<section class="panel"><div><span class="chip ' + g.type + '">' + typeName(g.type) + '</span><h3>' + esc(g.title) + '</h3></div><div class="stats"><div class="stat"><b>' + s.n + '</b><span>찍은 도장 / ' + (state.day + 1) + '일</span></div><div class="stat"><b>' + s.best + '</b><span>최장 연속</span></div><div class="stat"><b>' + outs.length + '</b><span>' + outName(g.type) + ' / ' + (week(state.day) + 1) + '주</span></div></div>';
      outs.forEach(function (o) { h += '<div class="post"><b class="small">' + (week(o.day) + 1) + '주차 ' + outName(g.type) + '</b>' + fieldsHtml(o.f) + '</div>'; });
      if (c) h += '<div class="good" style="position:static;align-self:flex-end">' + (c.full ? '완주' : '여기까지<br>완주') + '</div><p class="said" style="padding:0">' + esc(c.text) + '</p>';
      else if (left <= 0 || ui.closing[g.id]) h += '<form data-form="close" data-g="' + g.id + '"><label>마무리 회고<span class="hint">어디까지 했고, 무엇을 배웠는지 적어요.</span><textarea id="cl-' + g.id + '" name="text"></textarea></label><label style="flex-direction:row;align-items:center;gap:8px;font-weight:400"><input type="checkbox" id="clf-' + g.id + '" name="full"> 증거(' + esc(g.done) + ')를 남겼어요</label><p class="err" hidden></p><div><button class="btn red">마무리하기</button></div></form>';
      else h += '<div><button class="btn sm" data-act="closing" data-g="' + g.id + '">여기서 마무리하기</button></div>';
      h += '</section>';
    });
    if (state.goals.every(function (g) { return state.closing[g.id]; })) h += '<section class="panel"><h3>다음 혼커톤</h3><p class="muted">회고에서 나온 것을 다음 선언으로 이어 가요.</p><div><button class="btn pri" data-act="again">새 기수로 다시 선언하기</button></div></section>';
    return h;
  }

  function render() {
    var left = LEN - 1 - state.day;
    document.getElementById('cohort').innerHTML = '<div class="railh">11월 기수 · 오늘</div>' + ['me'].concat(BOTS).map(function (k) { return '<div class="mem"><i class="pip' + (k === 'me' ? ' me' : '') + (didToday(k) ? ' on' : '') + '"></i><span class="nm">' + esc(nameOf(k)) + (k === BUDDY ? ' <span class="muted small">버디</span>' : '') + '</span>' + (k === BUDDY && !didToday(k) ? '<button class="btn sm" data-act="poke">콕</button>' : '') + '</div>'; }).join('');
    document.getElementById('proto').innerHTML = '<span>프로토타입 조작' + (state.sample ? '<br>내 목표와 도장은 예시예요' : '') + '</span><button class="btn sm" data-act="next"' + (left <= 0 ? ' disabled' : '') + '>다음 날로 넘기기</button>' + (state.sample ? '<button class="btn sm" data-act="clear">예시 지우고 직접 선언</button>' : '<button class="btn sm" data-act="reset">' + (ui.armed ? '한 번 더 누르면 지워져요' : '예시로 초기화') + '</button>');
    [].forEach.call(document.querySelectorAll('#nav a'), function (a) { if (a.getAttribute('href') === '#' + view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.getElementById('view').innerHTML = ({ today: vToday, write: vWrite, library: vLibrary, wall: vWall, retro: vRetro })[view]();
    ui.stamp = null;
  }
  function route() { var h = (location.hash || '').slice(1); view = VIEWS.indexOf(h) >= 0 ? h : 'today'; render(); window.scrollTo(0, 0); }
  function go(v) { if (location.hash === '#' + v) route(); else location.hash = v; }
  function fail(f, m) { var e = f.querySelector('.err'); e.textContent = m; e.hidden = false; }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.dataset.act;
    if (a === 'book' && ev.target.closest('.rx, form, dl')) return;
    if (a !== 'reset') ui.armed = false;
    if (a === 'next') { nextDay(); ui.selDay = state.day; toast((state.day + 1) + '일차가 됐어요. 동료들의 새 도장이 찍혔어요.'); }
    else if (a === 'clear' || a === 'again') { fresh(false); ui.selDay = 0; save(); go('wall'); toast(a === 'clear' ? '예시를 지웠어요. 첫 선언을 걸어 보세요.' : '새 기수가 시작됐어요.'); return; }
    else if (a === 'reset') { if (!ui.armed) { ui.armed = true; render(); return; } ui.armed = false; fresh(true); ui.selDay = state.day; toast('예시로 되돌렸어요.'); }
    else if (a === 'day') ui.selDay = +b.dataset.d;
    else if (a === 'write') { ui.wg = b.dataset.g; go('write'); return; }
    else if (a === 'filter') ui.filter = b.dataset.f;
    else if (a === 'book') ui.open = b.dataset.id || null;
    else if (a === 'closing') ui.closing[b.dataset.g] = true;
    else if (a === 'poke') toast(MEMBERS[BUDDY].name + ' 님을 콕 찔렀어요.');
    else if (a === 'del') { var id = b.dataset.g; state.goals = state.goals.filter(function (g) { return g.id !== id; }); state.posts = state.posts.filter(function (p) { return p.goalId !== id; }); delete state.closing[id]; }
    else if (a === 'rx') { var arr = byId(b.dataset.id).rx[b.dataset.k], i = arr.indexOf('me'); if (i >= 0) arr.splice(i, 1); else arr.push('me'); }
    save(); render();
  });
  document.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.book[role=button]')) { ev.preventDefault(); ev.target.click(); } });

  document.addEventListener('submit', function (ev) {
    var f = ev.target, kind = f.dataset.form; if (!kind) return;
    ev.preventDefault();
    var v = function (n) { return (f.elements[n] ? f.elements[n].value : '').trim(); }, g = goal(f.dataset.g);
    if (kind === 'ci') {
      var t = v('text');
      if (g.type === 'take' && t.length < 10) return fail(f, '알게 된 것을 10자 이상으로 적어 주세요. 떠올려서 쓰는 한 줄이 인출이에요.');
      if (g.type === 'make' && t.length < 4) return fail(f, '오늘 만든 것을 한 줄로 적어 주세요.');
      post({ who: 'me', goalId: g.id, goal: g.title, type: g.type, kind: 'daily', day: state.day, text: t, link: /^https?:\/\//.test(v('link')) ? v('link') : '' });
      ui.stamp = g.id; ui.selDay = state.day; toast('쾅. 오늘 도장을 찍었어요.');
    } else if (kind === 'out') {
      var fs = [], bad = false;
      TPL[g.type].forEach(function (tp, i) {
        var val = tp[1] === 3 ? [v('s0'), v('s1'), v('s2')] : v('f' + i);
        if (tp[1] === 3) { if (val.some(function (x) { return x.length < 5; })) bad = true; val = val.join('\n'); } else if (val.length < 15) bad = true;
        fs.push([tp[0], val]);
      });
      if (bad) return fail(f, '세 칸을 모두 채워 주세요. 요약은 세 줄 모두, 나머지는 15자 이상이에요.');
      var np = post({ who: 'me', goalId: g.id, goal: g.title, type: g.type, kind: 'output', day: state.day, f: fs });
      toast('서재에 올렸어요. 동료 반응을 기다리는 중이에요.');
      setTimeout(function () {
        if (state.posts.indexOf(np) < 0 || rxN(np)) return;
        np.rx.learn.push(BUDDY); save(); toast(MEMBERS[BUDDY].name + ' 님이 "배웠어요"를 남겼어요. 이번 주 완료!');
        var ae = document.activeElement; if (!(ae && /INPUT|TEXTAREA/.test(ae.tagName) && ae.value)) render();
      }, 4000);
    } else if (kind === 'cm') { if (!v('t')) return; byId(f.dataset.id).cm.push({ who: 'me', text: v('t') }); }
    else if (kind === 'close') {
      if (v('text').length < 20) return fail(f, '어디까지 했고 무엇을 배웠는지 20자 이상으로 적어 주세요.');
      state.closing[g.id] = { text: v('text'), full: f.elements.full.checked };
      toast(f.elements.full.checked ? '완주를 축하해요.' : '여기까지도 완주예요.');
    } else if (kind === 'goal') {
      if (v('title').length < 2) return fail(f, '하고 싶던 일을 적어 주세요.');
      if (v('done').length < 4) return fail(f, '끝났다는 증거를 적어 주세요. 눈에 보이는 결과물이면 돼요.');
      state.name = v('name'); state.sample = false;
      state.goals.push({ id: 'g' + (state.seq++), title: v('title'), type: f.elements.type.value, done: v('done'), form: v('form') });
      save(); render(); toast('선언이 벽에 걸렸어요. 오늘부터 시작이에요.'); return;
    }
    save(); render();
  });

  document.addEventListener('input', function (ev) {
    var k = ev.target.dataset && ev.target.dataset.pv; if (!k) return;
    var o = document.querySelector('[data-out="' + k + '"]'); if (!o) return;
    var val = ev.target.value.trim();
    o.textContent = val || (k[0] === 's' ? ['첫째 줄', '둘째 줄', '셋째 줄'][+k[1]] : '여기에 미리보기가 나타나요');
    o.className = val ? '' : 'ph';
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.change === 'wg') { ui.wg = t.value; render(); return; }
    if (t.name !== 'type' || !t.closest('[data-form="goal"]')) return;
    var take = t.value === 'take';
    document.getElementById('g-formwrap').hidden = !take;
    document.getElementById('g-hint').textContent = take ? '증거는 분량보다 인출로 적어요. "한 권 다 읽기"보다 "블로그에 올린 독후감 1편"' : '증거는 분량보다 결과물로 적어요. 예: 지인 3명이 써볼 수 있는 배포 주소';
  });

  state = load();
  if (!state) { fresh(true); save(); }
  ui.selDay = state.day;
  window.addEventListener('hashchange', route);
  route();
})();
</script>
